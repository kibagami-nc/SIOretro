@switch (view()) {
  @case ('game') {
    <app-game [character]="selected()" (exit)="onExit()" />
  }
  @case ('editor') {
    <app-editor (play)="onEditorPlay()" (exit)="onExit()" />
  }
  @case ('menu') {
    <app-menu (play)="onPlay($event)" (edit)="onEdit()" (back)="onBackHome()" />
  }
  @default {
    <app-home (play)="onStart()" (edit)="onEdit()" />
  }
}
